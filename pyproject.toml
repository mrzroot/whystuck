[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whystuck"
dynamic = ["version"]
description = "Run any command with an idle watchdog. When it hangs, whystuck tells you why (pager, editor, y/n prompt, password, watch mode, server, lock, stalled connect) and prints the non-interactive fix."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohammadreza Zare", email = "mrzroot@users.noreply.github.com" }]
keywords = ["cli", "debugging", "hang", "stuck", "pty", "ai-agents", "non-interactive", "devtools", "proc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/mrzroot/whystuck"
Issues = "https://github.com/mrzroot/whystuck/issues"
Changelog = "https://github.com/mrzroot/whystuck/blob/main/CHANGELOG.md"

[project.scripts]
whystuck = "whystuck:main"

[tool.setuptools]
py-modules = ["whystuck"]

[tool.setuptools.dynamic]
version = { attr = "whystuck.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
